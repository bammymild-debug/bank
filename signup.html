<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyobamiBank Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-container {
      width: 100%;
      max-width: 500px;
      background: #111827;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 50px 40px;
      position: relative;
      overflow: hidden;
    }

    .signup-container::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.08);
      top: -120px;
      right: -120px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: #1e293b;
      color: white;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .form-group input::placeholder,
    .form-group select::placeholder {
      color: #64748b;
    }

    .form-group input:focus,
    .form-group select:focus {
      border: 1px solid #38bdf8;
      background: #1e293b;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .signup-btn {
      margin-top: 10px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .signup-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
    }

    .login-link {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 14px;
    }

    .login-link a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .terms {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
    }

    .terms a {
      color: #38bdf8;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      color: #bae6fd;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .signup-container {
        padding: 35px 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 24px;
      }
    }

    @media (max-width:900px){
      .menu a,
      .sidebar-bottom a{
        flex:1 1 48%;
        min-width:140px;
      }

      .sidebar-bottom{
        flex-direction:row;
        flex-wrap:wrap;
      }

      .sidebar{
        padding:20px 15px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
      }
    }

    @media (max-width:600px){
      .sidebar{
        width:100%;
      }

      .menu{
        flex-direction:column;
      }

      .menu a,
      .sidebar-bottom a{
        flex:1 1 100%;
      }

      .main{
        padding:16px;
      }

      .sidebar-bottom{
        gap:10px;
      }
    }
  </style>
</head>

<body>

  <div class="signup-container">

    <div class="header">
      <div class="logo">AyobamiBank</div>
      <h1>Create Account</h1>
      <p>Join thousands of satisfied customers</p>
    </div>

    <form class="signup-form">

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="John" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="+234 801 234 5678" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" required>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Address</label>
        <input type="text" placeholder="Street address" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City</label>
          <input type="text" placeholder="Lagos" required>
        </div>
        <div class="form-group">
          <label>Postal Code</label>
          <input type="text" placeholder="100001" required>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Password</label>
        <input type="password" placeholder="Enter strong password" required>
      </div>

      <div class="form-group full-width">
        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="signup-btn">Create Account</button>

      <div class="terms">
        By signing up, you agree to our
        <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>
      </div>

    </form>

    <div class="login-link">
      Already have an account? <a href="dashboard.html">Log in</a>
    </div>

    <div class="security-note">
      🔒 Your information is encrypted and secure. We never share your data with third parties.
    </div>

  </div>

</body>

</html>
