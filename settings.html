<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings - Ayobami Bank</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0f172a;
  color:#fff;
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:#111827;
  padding:20px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#38bdf8;
  margin-bottom:30px;
}

.sidebar a{
  display:block;
  padding:12px;
  color:#cbd5e1;
  text-decoration:none;
  border-radius:10px;
  margin-bottom:10px;
}

.sidebar a:hover{
  background:#1e293b;
  color:#fff;
}

.logout{
  margin-top:30px;
  background:#ef4444;
  text-align:center;
  color:#fff !important;
}

/* MAIN */
.main{
  flex:1;
  padding:30px;
}

h1{
  margin-bottom:20px;
}

/* SETTINGS BOXES */
.settings-box{
  background:#111827;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,0.05);
}

.settings-box h3{
  margin-bottom:15px;
  color:#38bdf8;
}

input, select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:#fff;
  outline:none;
}

button{
  padding:12px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#2563eb;
  color:#fff;
}

/* RESPONSIVE */
@media(max-width:800px){
  body{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
  }
}

    @media (max-width:900px){
      .menu a,
      .sidebar-bottom a{
        flex:1 1 48%;
        min-width:140px;
      }

      .sidebar-bottom{
        flex-direction:row;
        flex-wrap:wrap;
      }

      .sidebar{
        padding:20px 15px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
      }
    }

    @media (max-width:600px){
      .sidebar{
        width:100%;
      }

      .menu{
        flex-direction:column;
      }

      .menu a,
      .sidebar-bottom a{
        flex:1 1 100%;
      }

      .main{
        padding:16px;
      }

      .sidebar-bottom{
        gap:10px;
      }
    }

    .menu-toggle{
      display:none;
      position:absolute;
      top:20px;
      right:20px;
      width:44px;
      height:44px;
      background:#1e293b;
      border:none;
      border-radius:14px;
      cursor:pointer;
      align-items:center;
      justify-content:center;
      gap:4px;
      flex-direction:column;
      padding:8px;
    }

    .menu-toggle span{
      width:18px;
      height:2px;
      background:#cbd5e1;
      border-radius:2px;
      display:block;
      transition:0.3s ease;
    }

    @media (max-width:900px){
      .menu-toggle{
        display:flex;
      }

      .sidebar{
        width:100%;
        position:relative;
      }

      .menu,
      .sidebar-bottom{
        display:none;
      }

      .sidebar.open .menu,
      .sidebar.open .sidebar-bottom{
        display:flex;
      }

      .sidebar.open .sidebar-bottom{
        flex-direction:column;
      }
    }
</style>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <button class="menu-toggle" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="logo">AyobamiBank</div>

  <nav class="menu">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="payment.html">Payments</a>
        <a href="transfer.html">Transfers</a>
        <a href="analytics.html">Analytics</a>
        <a href="cards.html">Cards</a>
        <a href="loans.html">Loans</a>
        <a href="settings.html">Settings</a>
      </nav>

  <a class="logout" href="logout.html">Log Out</a>
  </div>

  <!-- BANK SETTINGS -->
  <div class="settings-box">
    <h3>Bank Preferences</h3>
    <select>
      <option>Currency - USD</option>
      <option>Currency - NGN</option>
      <option>Currency - EUR</option>
    </select>

    <select>
      <option>Notifications ON</option>
      <option>Notifications OFF</option>
    </select>

    <button>Save Settings</button>
  </div>

  <!-- SECURITY -->
  <div class="settings-box">
    <h3>Security</h3>
    <input type="text" placeholder="Enable 2FA (Phone)">
    <button>Enable Security</button>
  </div>

</div>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    menuToggle?.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  </script>
</body>
</html>
