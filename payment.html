<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AyobamiBank - Payments</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Inter',sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:260px;
      background:#111827;
      padding:30px 20px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border-right:1px solid rgba(255,255,255,0.05);
    }

    .logo{
      font-size:28px;
      font-weight:700;
      color:#38bdf8;
      margin-bottom:40px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .menu a{
      text-decoration:none;
      color:#cbd5e1;
      padding:14px 18px;
      border-radius:14px;
      transition:0.3s;
      font-weight:500;
    }

    .menu a:hover,
    .menu a.active{
      background:#1e293b;
      color:white;
    }

    .sidebar-bottom{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .signup{
      padding:14px 18px;
      border-radius:14px;
      background:#1e293b;
      text-align:center;
      text-decoration:none;
      color:white;
      font-weight:600;
      transition:0.3s;
      border:1px solid rgba(255,255,255,0.05);
    }

    .signup:hover{
      background:#273549;
    }

    .logout{
      padding:14px 18px;
      border-radius:14px;
      background:#ef4444;
      text-align:center;
      text-decoration:none;
      color:white;
      font-weight:600;
      transition:0.3s;
    }

    .logout:hover{
      opacity:0.9;
    }

    /* MAIN */

    .main{
      flex:1;
      padding:30px;
    }

    .topbar{
      margin-bottom:30px;
    }

    .topbar h1{
      font-size:32px;
      margin-bottom:8px;
    }

    .topbar p{
      color:#94a3b8;
    }

    /* PAYMENT CARD */

    .payment-card{
      max-width:700px;
      background:#111827;
      border-radius:24px;
      padding:30px;
      border:1px solid rgba(255,255,255,0.05);
    }

    .payment-card h2{
      margin-bottom:25px;
      font-size:24px;
    }

    .payment-form{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .payment-form input,
    .payment-form select{
      width:100%;
      padding:16px;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:white;
      outline:none;
      font-size:15px;
    }

    .payment-form input::placeholder{
      color:#94a3b8;
    }

    .payment-form button{
      padding:16px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#38bdf8,#2563eb);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .payment-form button:hover{
      transform:scale(1.02);
    }

    .recent-payments{
      margin-top:30px;
      background:#111827;
      border-radius:24px;
      padding:25px;
      border:1px solid rgba(255,255,255,0.05);
      max-width:700px;
    }

    .recent-payments h3{
      margin-bottom:20px;
    }

    .payment-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 0;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .payment-item:last-child{
      border-bottom:none;
    }

    .payment-name{
      font-weight:600;
    }

    .payment-date{
      font-size:13px;
      color:#94a3b8;
      margin-top:4px;
    }

    .amount{
      color:#22c55e;
      font-weight:600;
    }

    /* RESPONSIVE */

    @media(max-width:850px){

      body{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
      }

      .menu{
        flex-direction:row;
        flex-wrap:wrap;
      }
    }

    @media(max-width:600px){

      .main{
        padding:20px;
      }

      .topbar h1{
        font-size:26px;
      }
    }

    @media (max-width:900px){
      .menu a,
      .sidebar-bottom a{
        flex:1 1 48%;
        min-width:140px;
      }

      .sidebar-bottom{
        flex-direction:row;
        flex-wrap:wrap;
      }

      .sidebar{
        padding:20px 15px;
      }

      .topbar{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
      }
    }

    @media (max-width:600px){
      .sidebar{
        width:100%;
      }

      .menu{
        flex-direction:column;
      }

      .menu a,
      .sidebar-bottom a{
        flex:1 1 100%;
      }

      .main{
        padding:16px;
      }

      .sidebar-bottom{
        gap:10px;
      }
    }

    .menu-toggle{
      display:none;
      position:absolute;
      top:20px;
      right:20px;
      width:44px;
      height:44px;
      background:#1e293b;
      border:none;
      border-radius:14px;
      cursor:pointer;
      align-items:center;
      justify-content:center;
      gap:4px;
      flex-direction:column;
      padding:8px;
    }

    .menu-toggle span{
      width:18px;
      height:2px;
      background:#cbd5e1;
      border-radius:2px;
      display:block;
      transition:0.3s ease;
    }

    @media (max-width:900px){
      .menu-toggle{
        display:flex;
      }

      .sidebar{
        width:100%;
        position:relative;
      }

      .menu,
      .sidebar-bottom{
        display:none;
      }

      .sidebar.open .menu,
      .sidebar.open .sidebar-bottom{
        display:flex;
      }

      .sidebar.open .sidebar-bottom{
        flex-direction:column;
      }
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">
    <button class="menu-toggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div>

      <div class="logo">AyobamiBank</div>

      <nav class="menu">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="payment.html">Payments</a>
        <a href="transfer.html">Transfers</a>
        <a href="analytics.html">Analytics</a>
        <a href="cards.html">Cards</a>
        <a href="loans.html">Loans</a>
        <a href="settings.html">Settings</a>
      </nav>

    </div>

    <div class="sidebar-bottom">
      <a href="signup.html" class="signup">Sign Up</a>
      <a href="logout.html" class="logout">Log Out</a>
    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <div class="topbar">
      <h1>Payments 💳</h1>
      <p>Pay bills and manage your payment activities.</p>
    </div>

    <!-- PAYMENT FORM -->

    <section class="payment-card">

      <h2>Make a Payment</h2>

      <form class="payment-form">

        <input type="text" placeholder="Full Name" required>

        <input type="email" placeholder="Email Address" required>

        <select required>
          <option>Select Payment Type</option>
          <option>Electricity Bill</option>
          <option>Water Bill</option>
          <option>Internet Subscription</option>
          <option>School Fees</option>
          <option>TV Subscription</option>
        </select>

        <input type="number" placeholder="Amount" required>

        <input type="text" placeholder="Card Number" required>

        <button type="submit">Pay Now</button>

      </form>

    </section>

    <!-- RECENT PAYMENTS -->

    <section class="recent-payments">

      <h3>Recent Payments</h3>

      <div class="payment-item">
        <div>
          <div class="payment-name">DSTV Subscription</div>
          <div class="payment-date">May 8, 2026</div>
        </div>

        <div class="amount">-$45</div>
      </div>

      <div class="payment-item">
        <div>
          <div class="payment-name">Electricity Bill</div>
          <div class="payment-date">May 5, 2026</div>
        </div>

        <div class="amount">-$120</div>
      </div>

      <div class="payment-item">
        <div>
          <div class="payment-name">School Fees</div>
          <div class="payment-date">May 2, 2026</div>
        </div>

        <div class="amount">-$950</div>
      </div>

    </section>

  </main>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    menuToggle?.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  </script>
</body>
</html>
